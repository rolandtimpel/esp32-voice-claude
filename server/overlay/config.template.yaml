# Wird beim Container-Start von entrypoint.sh aus Umgebungsvariablen (server/.env)
# gerendert und als data/.config.yaml abgelegt. Überschreibt/ergänzt die Defaults aus
# config.yaml im Basisimage - siehe dessen Kommentare für alle verfügbaren Optionen.
server:
  ip: 0.0.0.0
  port: ${WS_PORT}
  http_port: ${HTTP_PORT}
  websocket: ws://${LAN_IP}:${WS_PORT}/xiaozhi/v1/
  vision_explain: http://${LAN_IP}:${HTTP_PORT}/mcp/vision/explain

selected_module:
  VAD: SileroVAD
  ASR: FunASR
  LLM: AnthropicLLM
  TTS: EdgeTTS
  Memory: nomem
  Intent: nointent

ASR:
  FunASR:
    type: fun_local
    model_dir: models/SenseVoiceSmall
    output_dir: tmp/
    language: ${ASR_LANGUAGE}

LLM:
  AnthropicLLM:
    type: AnthropicLLM
    api_key: ${ANTHROPIC_API_KEY}
    model_name: ${ANTHROPIC_MODEL}
    max_tokens: 1024
    temperature: 0.7

TTS:
  EdgeTTS:
    type: edge
    voice: ${TTS_VOICE}
    output_dir: tmp/
