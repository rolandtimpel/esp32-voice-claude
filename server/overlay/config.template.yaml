# Wird beim Container-Start von entrypoint.sh aus Umgebungsvariablen (server/.env)
# gerendert und als data/.config.yaml abgelegt. Überschreibt/ergänzt die Defaults aus
# config.yaml im Basisimage - siehe dessen Kommentare für alle verfügbaren Optionen.
server:
  ip: 0.0.0.0
  port: ${WS_PORT}
  http_port: ${HTTP_PORT}
  websocket: ws://${LAN_IP}:${WS_PORT}/xiaozhi/v1/
  vision_explain: http://${LAN_IP}:${HTTP_PORT}/mcp/vision/explain

selected_module:
  VAD: SileroVAD
  ASR: GroqASR
  LLM: AnthropicLLM
  TTS: EdgeTTS
  Memory: nomem
  Intent: function_call

Intent:
  function_call:
    type: function_call
    # Bewusst leer: keine Server-Plugins (kein hass_*, kein web_search, etc.) -
    # nur die geräte-eigenen MCP-Tools (Lautstärke/Helligkeit/Theme), die
    # unabhängig davon immer verfügbar sind. Phase 1 bleibt ohne Smart-Home.
    functions: []

ASR:
  GroqASR:
    type: openai
    api_key: ${GROQ_API_KEY}
    base_url: https://api.groq.com/openai/v1/audio/transcriptions
    model_name: whisper-large-v3-turbo
    output_dir: tmp/
    language: de

LLM:
  AnthropicLLM:
    type: AnthropicLLM
    api_key: ${ANTHROPIC_API_KEY}
    workspace_id: ${ANTHROPIC_WORKSPACE_ID}
    model_name: ${ANTHROPIC_MODEL}
    max_tokens: 1024
    temperature: 0.7

TTS:
  EdgeTTS:
    type: edge
    voice: ${TTS_VOICE}
    output_dir: tmp/
    language: Deutsch

prompt: |
  Du bist ein freundlicher, hilfsbereiter Sprachassistent. Antworte immer auf Deutsch, in natürlicher, lockerer Umgangssprache – so wie man normal spricht, nicht steif oder förmlich. Halte deine Antworten kurz und prägnant, da sie laut vorgelesen werden. Keine langen Aufzählungen, keine Markdown-Formatierung, einfach natürlich gesprochene Sätze.
